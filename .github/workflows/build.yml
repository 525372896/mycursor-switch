name: build

# 打 tag（vX.Y.Z）时自动构建 Windows + macOS 安装包，并发布到 GitHub Release。
# 也可在 Actions 页手动触发（workflow_dispatch），用于试构建（不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 允许把安装包上传到 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      # 打 tag 时发布到 Release；手动触发时只构建不发布
      - name: Build & publish (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --publish never

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore
