<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>MyCursor 换号助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✦</span>
      <div>
        <div class="brand-title">MyCursor 换号助手</div>
        <div class="brand-sub">粘 token 加号 · 一键换号登录 Cursor</div>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main>
    <!-- 工具条：加号按钮 + 刷新 + 计数 -->
    <div class="toolbar">
      <button id="addBtn" class="btn btn-primary">➕ 添加账号</button>
      <button id="refreshBtn" class="btn btn-ghost">🔄 刷新</button>
      <span id="count" class="count"></span>
    </div>

    <!-- 账号分页列表（主内容） -->
    <section class="listwrap">
      <div id="list" class="list"></div>
      <div id="empty" class="empty">还没有账号，点上面「➕ 添加账号」粘 token 加进来。</div>
      <div id="pager" class="pager"></div>
    </section>

    <!-- 日志（换号进度/结果） -->
    <section class="card logcard">
      <div class="card-head"><div class="card-title">📜 日志</div><button id="clearLog" class="btn btn-ghost btn-sm">清空</button></div>
      <div id="log" class="log"></div>
    </section>
  </main>

  <!-- 添加账号弹窗 -->
  <div id="addModal" class="modal-hide">
    <div class="sheet">
      <div class="shead"><span>➕ 添加账号</span><button class="x" id="addClose">×</button></div>
      <div class="sbody">
        <p class="hint">粘贴卖家给的 <b>Cursor 会话 token</b>（<code>user_xxx::eyJ…</code>，或整段 <code>WorkosCursorSessionToken=…</code> cookie 也行）。会校验一次是否有效。</p>
        <textarea id="tokenInput" rows="5" placeholder="在此粘贴 token…"></textarea>
        <div class="row">
          <button id="addSubmit" class="btn btn-primary">校验并添加</button>
          <span id="addMsg" class="msg"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
