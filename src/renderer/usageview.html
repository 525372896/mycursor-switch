<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>额度</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: #0f1729; font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0f1729; color: #e6ecff; border-bottom: 1px solid #26324f; flex-shrink: 0; }
    .em { font-weight: 600; font-size: 13px; color: #8ea0c8; margin-right: 6px; max-width: 38%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab { border: 1px solid #26324f; background: #1b2748; color: #e6ecff; border-radius: 8px; padding: 6px 16px; cursor: pointer; font-size: 13px; transition: .15s; }
    .tab:hover { border-color: #3b82f6; }
    .tab.on { background: #2563eb; border-color: #2563eb; }
    .sp { flex: 1; }
    .rf { border: 1px solid #26324f; background: transparent; color: #8ea0c8; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .rf:hover { border-color: #3b82f6; color: #e6ecff; }
    #wvwrap { flex: 1; min-height: 0; display: flex; background: #fff; }
    webview { flex: 1; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="em" id="email"></span>
    <button class="tab on" id="tabUsage">用量 Usage</button>
    <button class="tab" id="tabSpending">花费 Spending</button>
    <span class="sp"></span>
    <button class="rf" id="reload">刷新</button>
  </div>
  <div id="wvwrap"></div>
  <script src="usageview.js"></script>
</body>
</html>
